name: Production Verification

on:
  push:
    branches:
      - feat/docker-deployment-foundation
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  WC26_PRODUCTION_URL: ${{ vars.WC26_PRODUCTION_URL }}
  WC26_EXPECTED_COMMIT_SHA: ${{ github.sha }}
  WC26_CLOUD_OBSERVABILITY_MAX_ATTEMPTS: "150"
  WC26_CLOUD_OBSERVABILITY_POLL_INTERVAL: "2"
  ARTIFACT_DIRECTORY: artifacts/production-verification

jobs:
  verify:
    name: Verify Railway Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare diagnostics directory
        shell: bash
        run: |
          mkdir -p "${ARTIFACT_DIRECTORY}"

      - name: Validate production configuration
        id: configuration
        shell: bash
        run: |
          set -o pipefail

          {
            if [[ -z "${WC26_PRODUCTION_URL}" ]]; then
              echo "::error::WC26_PRODUCTION_URL repository variable is missing."
              exit 1
            fi

            case "${WC26_PRODUCTION_URL}" in
              https://*)
                ;;
              *)
                echo "::error::WC26_PRODUCTION_URL must use HTTPS."
                exit 1
                ;;
            esac

            if [[ ! "${WC26_EXPECTED_COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Expected commit SHA is invalid."
              exit 1
            fi

            echo "ProductionURL=${WC26_PRODUCTION_URL}"
            echo "ExpectedCommitSHA=${WC26_EXPECTED_COMMIT_SHA}"
          } 2>&1 | tee \
            "${ARTIFACT_DIRECTORY}/configuration.log"

      - name: Wait for CI quality gates
        id: quality_gates
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e

          python - <<'PY' \
            > "${ARTIFACT_DIRECTORY}/quality-gates.log" \
            2>&1
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from typing import Any


          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_sha = os.environ["TARGET_SHA"]

          workflows = {
              "Python Quality": "python-quality.yml",
              "Docker Validation": "docker-validation.yml",
          }

          timeout_seconds = 15 * 60
          poll_interval_seconds = 5
          deadline = time.monotonic() + timeout_seconds


          def fetch_workflow_runs(
              workflow_file: str,
          ) -> list[dict[str, Any]]:
              query = urllib.parse.urlencode(
                  {
                      "head_sha": target_sha,
                      "event": "push",
                      "per_page": 20,
                  }
              )

              url = (
                  "https://api.github.com/repos/"
                  f"{repository}/actions/workflows/"
                  f"{workflow_file}/runs?{query}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "wc26-production-verification",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  document = json.load(response)

              runs = document.get(
                  "workflow_runs",
                  [],
              )

              if not isinstance(runs, list):
                  raise RuntimeError(
                      "GitHub Actions response does not contain "
                      "a workflow run list."
                  )

              return [
                  run
                  for run in runs
                  if (
                      isinstance(run, dict)
                      and run.get("head_sha") == target_sha
                  )
              ]


          while time.monotonic() <= deadline:
              all_successful = True

              for workflow_name, workflow_file in workflows.items():
                  runs = fetch_workflow_runs(
                      workflow_file
                  )

                  if not runs:
                      print(
                          f"{workflow_name}: waiting for run creation",
                          flush=True,
                      )
                      all_successful = False
                      continue

                  latest_run = max(
                      runs,
                      key=lambda run: int(
                          run.get("run_number", 0)
                      ),
                  )

                  status = latest_run.get("status")
                  conclusion = latest_run.get("conclusion")
                  html_url = latest_run.get("html_url")

                  print(
                      f"{workflow_name}: "
                      f"status={status} "
                      f"conclusion={conclusion}",
                      flush=True,
                  )

                  if status != "completed":
                      all_successful = False
                      continue

                  if conclusion != "success":
                      raise SystemExit(
                          f"{workflow_name} failed for {target_sha}. "
                          f"Run: {html_url}"
                      )

              if all_successful:
                  print(
                      "All required CI quality gates passed.",
                      flush=True,
                  )
                  break

              time.sleep(
                  poll_interval_seconds
              )
          else:
              raise SystemExit(
                  "Timed out waiting for required CI quality gates."
              )
          PY

          exit_code="$?"

          cat \
            "${ARTIFACT_DIRECTORY}/quality-gates.log"

          exit "${exit_code}"

      - name: Run production observability acceptance test
        id: observability
        if: >-
          always()
          && steps.configuration.outcome == 'success'
          && (
            github.event_name != 'push'
            || steps.quality_gates.outcome == 'success'
          )
        shell: bash
        run: |
          set -o pipefail

          ./scripts/cloud_observability_test.sh \
            "${WC26_PRODUCTION_URL}" \
            2>&1 \
            | tee \
              "${ARTIFACT_DIRECTORY}/cloud-observability.log"

      - name: Run production API smoke test
        id: smoke
        if: >-
          always()
          && steps.configuration.outcome == 'success'
          && (
            github.event_name != 'push'
            || steps.quality_gates.outcome == 'success'
          )
        shell: bash
        run: |
          set -o pipefail

          ./scripts/cloud_smoke_test.sh \
            "${WC26_PRODUCTION_URL}" \
            2>&1 \
            | tee \
              "${ARTIFACT_DIRECTORY}/cloud-smoke.log"

      - name: Collect production diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "${ARTIFACT_DIRECTORY}"

          {
            echo "Workflow=${GITHUB_WORKFLOW}"
            echo "RunID=${GITHUB_RUN_ID}"
            echo "RunAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "Repository=${GITHUB_REPOSITORY}"
            echo "Event=${GITHUB_EVENT_NAME}"
            echo "Ref=${GITHUB_REF}"
            echo "RefName=${GITHUB_REF_NAME}"
            echo "CommitSHA=${GITHUB_SHA}"
            echo "ExpectedCommitSHA=${WC26_EXPECTED_COMMIT_SHA}"
            echo "ProductionURL=${WC26_PRODUCTION_URL}"
            echo "RunnerOS=${RUNNER_OS}"
            echo "RunnerArchitecture=${RUNNER_ARCH}"
          } > \
            "${ARTIFACT_DIRECTORY}/workflow-context.txt"

          if [[ -f "${ARTIFACT_DIRECTORY}/cloud-observability.log" ]]; then
            grep \
              -E '^(SuccessRequestID|ClientErrorRequestID)=' \
              "${ARTIFACT_DIRECTORY}/cloud-observability.log" \
              > "${ARTIFACT_DIRECTORY}/observability-request-ids.txt" \
              || true
          fi

          diagnostic_request_id="production-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          printf '%s\n' \
            "${diagnostic_request_id}" \
            > "${ARTIFACT_DIRECTORY}/diagnostic-request-id.txt"

          capture_get() {
            local name="$1"
            local path="$2"
            local request_id="${3:-}"

            local body_path="${ARTIFACT_DIRECTORY}/${name}.body"
            local header_path="${ARTIFACT_DIRECTORY}/${name}.headers"
            local metadata_path="${ARTIFACT_DIRECTORY}/${name}.metadata"

            local curl_arguments=(
              --silent
              --show-error
              --location
              --connect-timeout
              10
              --max-time
              60
              --request
              GET
              --header
              "Accept: application/json"
              --dump-header
              "${header_path}"
              --output
              "${body_path}"
              --write-out
              "%{http_code}"
            )

            if [[ -n "${request_id}" ]]; then
              curl_arguments+=(
                --header
                "X-Request-ID: ${request_id}"
              )
            fi

            http_status="$(
              curl \
                "${curl_arguments[@]}" \
                "${WC26_PRODUCTION_URL}${path}"
            )"

            curl_exit_code="$?"

            {
              echo "URL=${WC26_PRODUCTION_URL}${path}"
              echo "CurlExitCode=${curl_exit_code}"
              echo "HTTPStatus=${http_status:-unavailable}"
              echo "RequestID=${request_id:-none}"
            } > "${metadata_path}"
          }

          if [[ -n "${WC26_PRODUCTION_URL}" ]]; then
            capture_get \
              "health" \
              "/health" \
              "${diagnostic_request_id}"

            capture_get \
              "ready" \
              "/ready"

            capture_get \
              "deployment" \
              "/deployment"

            capture_get \
              "client-error" \
              "/api/v1/players/999999999" \
              "${diagnostic_request_id}-404"
          else
            echo \
              "Production URL unavailable; endpoint diagnostics skipped." \
              > "${ARTIFACT_DIRECTORY}/endpoint-diagnostics-skipped.txt"
          fi

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path


          artifact_directory = Path(
              os.environ["ARTIFACT_DIRECTORY"]
          )

          for body_path in artifact_directory.glob(
              "*.body"
          ):
              try:
                  document = json.loads(
                      body_path.read_text(
                          encoding="utf-8",
                      )
                  )
              except (
                  OSError,
                  json.JSONDecodeError,
              ):
                  continue

              pretty_path = body_path.with_suffix(
                  ".pretty.json"
              )

              pretty_path.write_text(
                  json.dumps(
                      document,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Write production verification summary
        if: always()
        env:
          CONFIGURATION_OUTCOME: ${{ steps.configuration.outcome }}
          QUALITY_GATES_OUTCOME: ${{ steps.quality_gates.outcome }}
          OBSERVABILITY_OUTCOME: ${{ steps.observability.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          {
            echo "## Production Verification"
            echo
            echo "- Environment: Railway production"
            echo "- Commit: \`${WC26_EXPECTED_COMMIT_SHA}\`"
            echo "- Production URL: ${WC26_PRODUCTION_URL}"
            echo "- Configuration: ${CONFIGURATION_OUTCOME}"
            echo "- CI quality gates: ${QUALITY_GATES_OUTCOME}"
            echo "- Observability acceptance: ${OBSERVABILITY_OUTCOME}"
            echo "- Cloud smoke test: ${SMOKE_OUTCOME}"
            echo
            echo "Diagnostic artifact:"
            echo
            echo "\`production-verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload production verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-verification
          if-no-files-found: error
          retention-days: 14
